apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-ms
  namespace: customer-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-ms
  template:
    metadata:
      labels:
        app: customer-ms
    spec:
      containers:
        - name: customer-ms
          image: $ECR_REGISTRY/$ECR_REPOSITORY:latest
          ports:
            - containerPort: 8989
          resources:
            requests:
              cpu: 100m       # Solicita 100 milicores de CPU
              memory: 256Mi   # Solicita 256 Mebibytes de memória
            limits:
              cpu: 200m       # Limita a 200 milicores de CPU
              memory: 512Mi   # Limita a 512 Mebibytes de memória
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8989
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8989
            initialDelaySeconds: 30
            periodSeconds: 5